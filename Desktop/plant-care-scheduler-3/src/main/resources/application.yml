server:
  port: 8080

spring:
  application:
    name: plant-care-scheduler
  datasource:
    url: jdbc:h2:mem:plantcaredb;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 100MB

app:
  jwt:
    secret: plantCareSchedulerSecretKeyForJWTTokenGenerationMustBeAtLeast256BitsLongForSecurity
    expiration: 43200000
    refresh-expiration: 2592000000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  level:
    com.plantcare: INFO
